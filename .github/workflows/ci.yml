name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate HTML / CSS / SVG & assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libxml2-utils (xmllint)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: SVG well-formedness (xmllint)
        run: |
          set -e
          shopt -s nullglob
          svgs=(project/assets/*.svg project/assets/icons/*.svg)
          if [ ${#svgs[@]} -eq 0 ]; then echo "no SVGs found"; exit 1; fi
          for f in "${svgs[@]}"; do
            xmllint --noout "$f"
          done
          echo "✓ ${#svgs[@]} SVG(s) well-formed"

      - name: EPS sanity (header + BoundingBox)
        run: |
          set -e
          eps=project/assets/nozilla-logo.eps
          head -1 "$eps" | grep -q '^%!PS-Adobe' || { echo "missing EPS magic"; exit 1; }
          grep -q '^%%BoundingBox:' "$eps" || { echo "missing BoundingBox"; exit 1; }
          echo "✓ EPS header valid"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Asset integrity check
        run: node scripts/validate-assets.mjs

      - name: Icon set — CI rules & Font-Awesome name check
        run: node scripts/build-icons.mjs --check

      - name: Icon set — build is committed and up to date
        run: |
          set -e
          node scripts/build-icons.mjs
          if ! git diff --quiet -- project/assets/icons ICONS.md icons.html; then
            echo "✗ Icon-Build ist nicht aktuell — 'node scripts/build-icons.mjs' ausführen und committen:"
            git --no-pager diff --stat -- project/assets/icons ICONS.md icons.html
            exit 1
          fi
          echo "✓ Icon-Build aktuell"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python-pptx
        run: pip install --quiet python-pptx

      - name: Core icons — exported from icons.py and signed
        run: python3 scripts/export-icons.py --check

      - name: Signature — every icon carries the signal-green dot
        run: |
          set -e
          missing=0
          for f in project/assets/icon-*.svg project/assets/icons/*.svg; do
            grep -q 'x="54" y="54" width="6" height="6" fill="#00FF9C"' "$f" || {
              echo "✗ Signatur fehlt: $f"; missing=$((missing+1));
            }
          done
          [ "$missing" -eq 0 ] || { echo "✗ $missing Icon(s) ohne Signatur"; exit 1; }
          echo "✓ Signatur in allen Icons"
