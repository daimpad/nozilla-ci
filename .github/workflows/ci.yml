name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate HTML / CSS / SVG & assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libxml2-utils (xmllint)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils

      - name: SVG well-formedness (xmllint)
        run: |
          set -e
          shopt -s nullglob
          svgs=(project/assets/*.svg)
          if [ ${#svgs[@]} -eq 0 ]; then echo "no SVGs found"; exit 1; fi
          for f in "${svgs[@]}"; do
            echo "checking $f"
            xmllint --noout "$f"
          done
          echo "✓ ${#svgs[@]} SVG(s) well-formed"

      - name: EPS sanity (header + BoundingBox)
        run: |
          set -e
          eps=project/assets/nozilla-logo.eps
          head -1 "$eps" | grep -q '^%!PS-Adobe' || { echo "missing EPS magic"; exit 1; }
          grep -q '^%%BoundingBox:' "$eps" || { echo "missing BoundingBox"; exit 1; }
          echo "✓ EPS header valid"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Asset integrity check
        run: node scripts/validate-assets.mjs
