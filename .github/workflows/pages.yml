name: Deploy CI portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy zur Zeit; laufende nicht abbrechen, damit nichts halb online geht.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Seite zusammenstellen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakte sammeln
        run: |
          set -e
          mkdir -p _site
          # Alles ausliefern, was die Seite braucht — inklusive Fonts, Assets
          # und Vorlagen, weil das Portal direkt darauf verlinkt.
          tar -cf - \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./scripts' \
            --exclude='./httpdocs' \
            --exclude='./node_modules' \
            --exclude='./_site' \
            . | tar -xf - -C _site
          # Ohne diese Datei filtert Jekyll Pfade mit Unterstrich heraus.
          touch _site/.nojekyll
          echo "Dateien: $(find _site -type f | wc -l)"

      - name: Verlinkte Dateien prüfen
        run: |
          set -e
          for f in _site/ci/index.html _site/ci/icons.html _site/ci/ci-site.js \
                   _site/design-system.css _site/project/fonts.css \
                   _site/project/assets/nozilla-logo.svg \
                   _site/project/assets/print/briefpapier.pdf; do
            [ -f "$f" ] || { echo "fehlt: $f"; exit 1; }
          done
          echo "Pflichtdateien vorhanden."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
